# variables.yml
# Project-level variable dictionary.

lidar_signal_processing:
  background_range_m:
    min: 9000
    max: 12000

  valid_range_m:
    min: 30
    max: 6000

  smoothing:
    method: rolling_median
    window_bins: 5

  despiking:
    enabled: true
    method: median_absolute_deviation
    window_bins: 7
    threshold: 6.0